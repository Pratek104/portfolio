<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="900" height="640" fill="#34352f"/>
  <rect x="215" y="70" width="470" height="504" rx="16" fill="#262721"/>
  <!-- window chrome -->
  <path d="M215 118 h470 v-32 a16 16 0 0 0 -16 -16 h-438 a16 16 0 0 0 -16 16 z" fill="#1e1f1a"/>
  <circle cx="237" cy="94" r="5" fill="#4c4d44"/><circle cx="256" cy="94" r="5" fill="#4c4d44"/><circle cx="275" cy="94" r="5" fill="#4c4d44"/>
  <text x="296" y="99" font-size="11" letter-spacing="1.5" fill="#a4a296" font-weight="600">BOOKING CONCIERGE</text>
  <rect x="576" y="83" width="88" height="20" rx="10" fill="none" stroke="#4c4d44"/><circle cx="590" cy="93" r="3" fill="#d6ff2f"/><text x="600" y="97" font-size="9" letter-spacing="1.2" fill="#d6ff2f">MCP · LIVE</text>
  <line x1="215" y1="118" x2="685" y2="118" stroke="#3a3b33"/>
  <!-- user bubble -->
  <rect x="384" y="140" width="277" height="40" rx="12" fill="#4b4c43"/>
  <text x="649" y="164" font-size="13" fill="#f0eee7" text-anchor="end">Do you have a deluxe twin, 12–15 Oct?</text>
  <!-- agent bubble -->
  <circle cx="250" cy="216" r="12" fill="#d6ff2f"/><path d="M244 216 l4 4 8 -8" stroke="#11110f" stroke-width="2" fill="none"/>
  <rect x="239" y="236" width="296" height="40" rx="12" fill="#3a3b34"/>
  <text x="255" y="260" font-size="13" fill="#e8e6df">Yes — 3 deluxe twins are free, lake view.</text>
  <!-- availability card -->
  <rect x="239" y="296" width="330" height="128" rx="12" fill="#1d1e19" stroke="#3a3b34"/>
  <text x="257" y="322" font-size="10" letter-spacing="1.6" fill="#8f8d80">LIVE AVAILABILITY</text>
  <text x="553" y="322" font-size="13" font-weight="700" fill="#f0eee7" text-anchor="end">USD 96 / night</text>
  <!-- date cells -->
  <rect x="257" y="336" width="88" height="42" rx="8" fill="#2a2b25" stroke="#3a3b34"/>
  <text x="301" y="354" font-size="9" letter-spacing="1" fill="#8f8d80" text-anchor="middle">OCT</text>
  <text x="301" y="372" font-size="13" font-weight="700" fill="#f0eee7" text-anchor="middle">12</text>
  <rect x="351" y="336" width="88" height="42" rx="8" fill="#2a2b25" stroke="#3a3b34"/>
  <text x="395" y="354" font-size="9" letter-spacing="1" fill="#8f8d80" text-anchor="middle">OCT</text>
  <text x="395" y="372" font-size="13" font-weight="700" fill="#f0eee7" text-anchor="middle">13</text>
  <rect x="445" y="336" width="88" height="42" rx="8" fill="#2a2b25" stroke="#3a3b34"/>
  <text x="489" y="354" font-size="9" letter-spacing="1" fill="#8f8d80" text-anchor="middle">OCT</text>
  <text x="489" y="372" font-size="13" font-weight="700" fill="#f0eee7" text-anchor="middle">14</text>
  <!-- amenities -->
  <text x="257" y="400" font-size="10" letter-spacing="1.2" fill="#8f8d80">BREAKFAST · LAKE VIEW</text>
  <!-- reserve -->
  <rect x="465" y="384" width="104" height="30" rx="15" fill="#d6ff2f"/>
  <text x="517" y="403" font-size="11" font-weight="700" letter-spacing="1" fill="#11110f" text-anchor="middle">RESERVE</text>
  <!-- agent small bubble -->
  <circle cx="250" cy="452" r="12" fill="#d6ff2f"/><path d="M244 452 l4 4 8 -8" stroke="#11110f" stroke-width="2" fill="none"/>
  <rect x="239" y="472" width="238" height="40" rx="12" fill="#3a3b34"/>
  <text x="255" y="496" font-size="13" fill="#e8e6df">I held the room for 15 minutes.</text>
  <!-- input bar -->
  <rect x="239" y="528" width="366" height="38" rx="19" fill="#2f302a" stroke="#3a3b34"/>
  <text x="257" y="551" font-size="12" fill="#6f6d62">Try: “check price for 2 nights”</text>
  <rect x="613" y="526" width="42" height="42" rx="13" fill="#d6ff2f"/>
  <path d="M627 547 h14 m-6 -6 l7 6 -7 6" stroke="#11110f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
